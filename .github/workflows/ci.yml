name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        run: cargo test --workspace --lib --bins --tests -- --test-threads=1

      - name: Clippy
        run: cargo clippy --workspace

  windows:
    name: Windows (WinFsp)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # WinFsp is NOT required to build: winfsp-sys ships a built-in import
      # library and the binary delay-loads winfsp-x64.dll at runtime.
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check WinFsp feature
        run: cargo check -p ossfs --no-default-features --features fuse-winfsp

      - name: Test WinFsp feature
        run: cargo test -p ossfs --no-default-features --features fuse-winfsp --lib --bins

      - name: Clippy WinFsp feature
        run: cargo clippy -p ossfs --no-default-features --features fuse-winfsp --lib --bins

      - name: Check desktop tray app
        run: cargo check -p ossfs-tray --all-targets

      - name: Test desktop tray app
        run: cargo test -p ossfs-tray
