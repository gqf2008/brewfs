name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev

      # Toolchain is pinned (must match rust-toolchain.toml) so CI does not
      # drift when a new stable is released; edition 2024 requires >= 1.85.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        run: cargo test --workspace --lib --bins --tests -- --test-threads=1

      - name: Clippy
        run: cargo clippy --workspace

  # macOS compiles a large amount of otherwise-dead cfg code (objc2 dock
  # hook, FUSE-T installer, mac_dock_reopen, ...). fuser is pure Rust, so no
  # FUSE-T/macFUSE installation is needed to build and test.
  macos:
    name: Rust (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # The FUSE adapter needs pkg-config + a fuse library (macFUSE/FUSE-T
      # headers) that CI runners do not have; on macOS check/test the
      # metadata-store core (ossfs without the fuse feature) and the tray
      # app, which does not depend on the ossfs library crate.
      - name: Check workspace (no FUSE adapter)
        run: cargo check -p ossfs --no-default-features

      - name: Test core (no FUSE adapter)
        run: cargo test -p ossfs --no-default-features --lib --bins -- --test-threads=1

      - name: Test tray app
        run: cargo test -p ossfs-tray

      - name: Clippy (no FUSE adapter + tray)
        run: cargo clippy -p ossfs --no-default-features -p ossfs-tray --lib --bins

  windows:
    name: Windows (WinFsp)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # WinFsp is NOT required to build: winfsp-sys ships a built-in import
      # library and the binary delay-loads winfsp-x64.dll at runtime.
      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check WinFsp feature
        run: cargo check -p ossfs --no-default-features --features fuse-winfsp

      # Runtime DLL for the delay-loaded tests: system-recycle-bin tests
      # ($I/$R capture, set_recycle_i) exercise delay-loaded winfsp-x64.dll
      # symbols; without the DLL the test process dies with 0xc06d007e
      # (MOD_NOT_FOUND). The MSI can land per-machine or per-user depending
      # on winget defaults, so locate the DLL after install instead of
      # guessing the path; the delay loader searches PATH, so append the bin
      # dir to GITHUB_PATH.
      - name: Install WinFsp (runtime DLL for delay-loaded tests)
        shell: pwsh
        run: |
          # winget's exit code is not a reliable signal (non-zero for
          # "already installed" etc.) — ignore it and judge success solely
          # by locating winfsp-x64.dll below.
          winget install --id WinFsp.WinFsp --silent --accept-package-agreements --accept-source-agreements 2>$null
          $bin = @(
            "${env:ProgramFiles(x86)}\WinFsp\bin",
            "${env:ProgramFiles}\WinFsp\bin",
            "$env:LOCALAPPDATA\WinFsp\bin"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $bin) {
            $bin = (Get-ChildItem "${env:ProgramFiles(x86)}", "${env:ProgramFiles}", "$env:LOCALAPPDATA" `
              -Recurse -Filter winfsp-x64.dll -ErrorAction SilentlyContinue `
              | Select-Object -First 1).DirectoryName
          }
          if ($bin) { "$bin" | Out-File -FilePath $env:GITHUB_PATH -Append; Write-Host "WinFsp DLL at: $bin" }
          else { throw "winfsp-x64.dll not found after install" }

      # `--tests` also runs tests/cli.rs (the ossmount CLI integration test),
      # which does not need a mount or credentials and works on Windows.
      - name: Test WinFsp feature
        run: cargo test -p ossfs --no-default-features --features fuse-winfsp --lib --bins --tests

      - name: Clippy WinFsp feature
        run: cargo clippy -p ossfs --no-default-features --features fuse-winfsp --lib --bins

      - name: Check desktop tray app
        run: cargo check -p ossfs-tray --all-targets

      # Clippy the Windows-only cfg code in the tray (winutil.rs unsafe
      # Win32 blocks); the ubuntu job only lints the Linux cfg surface.
      - name: Clippy desktop tray app
        run: cargo clippy -p ossfs-tray --all-targets

      - name: Test desktop tray app
        run: cargo test -p ossfs-tray
