# Pin the toolchain so local dev, CI (.github/workflows/ci.yml) and the
# release workflows all build with the same compiler instead of tracking
# whatever `stable` happens to be on the runner.
#
# Edition 2024 needs >= 1.85, but the current dependency tree (slint 1.17)
# requires >= 1.92; 1.97 is the stable line current when this pin was added.
#
# The channel must be an EXACT version (e.g. "1.97.1", not "1.97"):
# `dtolnay/rust-toolchain@1.97` installs the toolchain as "1.97.1" (latest
# patch of that minor), while a bare "1.97" channel here makes rustup
# auto-provision a *separate* minimal toolchain named "1.97" without
# rustfmt/clippy — every `cargo fmt` in CI then fails with "cargo-fmt is not
# installed for the toolchain '1.97-…'". Keep this in sync with the
# `dtolnay/rust-toolchain@` refs in the workflows, and bump all of them
# together when a dependency update needs a newer rustc.
[toolchain]
channel = "1.97.1"
components = ["clippy", "rustfmt"]
