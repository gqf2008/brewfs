# Minimal standalone metadata service topology for local verification.
# Not a production HA shape: single meta-service instance + Redis backend.
name: brewfs-meta-service

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meta:
    build:
      context: ../..
      dockerfile: docker/compose-xfstests/Dockerfile.brewfs
    command: [
      "meta-serve",
      "--meta-url", "redis://redis:6379",
      "--listen", "0.0.0.0:7001",
    ]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "7001:7001"
